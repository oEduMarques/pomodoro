<!DOCTYPE html>
<html lang="en, pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="title-timer">Gi Pomodoro</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <section>
        <div class="btns-mode">
            <button data-time="1500" id="btn-pomodoro" class="btn-mode">Pomodoro</button>
            <button data-time="300" id="btn-short"  class="btn-mode">Short Break</button>
            <button data-time="900" id="btn-long"  class="btn-mode">Long Break</button>
        </div>
        <div>
            <h1 id="timer-display">25:00</h1>
        </div>
        <div>
            <button id="btn-control-timer">Start</button>
        </div>
    </section>

    <section>
        <div class="mixer-container">
            <h2 class="tittle-mixer">Ambient Mixer</h2>
            <div class="sound-controls">
                <div class="control-group">
                    <label>🌧️ Rain</label>
                    <input type="range" id="rain-slider" min="0" max="1" step="0.05" value="0">
                </div>
                <div class="control-group">
                    <label>🔥 Fire</label>
                    <input type="range" id="fire-slider" min="0" max="1" step="0.05" value="0">
                </div>
                <div class="control-group">
                    <label>🌳 Nature</label>
                    <input type="range" id="nature-slider" min="0" max="1" step="0.05" value="0">
                </div>
                <div class="control-group">
                    <label>⚡ Thunder</label>
                    <input type="range" id="thunder-slider" min="0" max="1" step="0.05" value="0">
                </div>
                <div class="control-group">
                    <label>🌊 Waterfall</label>
                    <input type="range" id="waterfall-slider" min="0" max="1" step="0.05" value="0">
                </div>
            </div>
        </div>
    </section>
    <script src="js/script.js"></script>
    <script src="js/soundScript.js"></script>
</body>

</html>
