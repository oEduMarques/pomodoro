<!DOCTYPE html>
<html lang="en, pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gi Pomodoro</title>
</head>
<body>
    <section>
        <div>
            <h1 id="timer-display">25:00</h1>
        </div>
        <div>
            <button id="btn-control-timer">Start</button>
        </div>
        <div class="btn-mode">
            <button data-time="1500" id="btn-pomodoro">Pomodoro</button>
            <button data-time="300" id="btn-short">Short Break</button>
            <button data-time="900" id="btn-long">Long Break</button>
        </div>        
    </section>
    <script src="script.js" defer></script>
</body>
</html>
